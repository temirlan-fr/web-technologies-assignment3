<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Typography</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="typography-page">
        <p class="label">TASK 0 / MEDIA QUERIES</p>

        <h1>Responsive Typography</h1>

        <p class="description">
            This page demonstrates how typography changes on mobile,
            tablet and desktop screen sizes using CSS media queries.
        </p>

        <div class="screen-info">
            <div class="info-card">
                <span>01</span>
                <h2>Mobile</h2>
                <p>Small screen typography.</p>
            </div>

            <div class="info-card">
                <span>02</span>
                <h2>Tablet</h2>
                <p>Medium screen typography.</p>
            </div>

            <div class="info-card">
                <span>03</span>
                <h2>Desktop</h2>
                <p>Large screen typography.</p>
            </div>
        </div>
    </main>

</body>
</html>
