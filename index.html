<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Layout</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="layout-page">
        <p class="label">TASK 1 / MEDIA QUERIES</p>

        <h1>Responsive Layout</h1>

        <p class="description">
            These three boxes change their position depending on
            the screen size.
        </p>

        <section class="boxes">
            <div class="box">
                <h2>Box One</h2>
                <p>First responsive box.</p>
            </div>

            <div class="box">
                <h2>Box Two</h2>
                <p>Second responsive box.</p>
            </div>

            <div class="box">
                <h2>Box Three</h2>
                <p>Third responsive box.</p>
            </div>
        </section>
    </main>

</body>
</html>
